name: Daily Stock Scan

on:
  schedule:
    - cron: '0 14 * * *'   # 香港時間每天晚上 10:00 左右
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run stock scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scanner.py

      - name: Commit and push latest_scan.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add latest_scan.json
          git commit -m "Update latest_scan.json [skip ci]" || echo "No changes to commit"
          git push